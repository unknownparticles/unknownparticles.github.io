<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">两层结构，两种偏移基准</title><desc id="desc">APP1 也可能装 XMP，先验证标识，再解析 TIFF。此图不表示固定字节位置。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#536580"/></marker></defs><rect x="0" y="0" width="1000" height="510" rx="20" fill="#f3f6fc"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="52" font-size="32" fill="#20304d">两层结构，两种偏移基准</text><text x="36" y="91" font-size="21" fill="#536580">APP1 也可能装 XMP，先验证标识，再解析 TIFF。此图不表示固定字节位置。</text><rect x="40" y="145" width="920" height="80" rx="14" fill="#dbe5ff"/><text x="64" y="194" font-size="26" fill="#20304d">JPEG：SOI → APP0 / APP1 / 其他段 → SOS → 扫描数据</text><rect x="40" y="270" width="300" height="90" rx="14" fill="#d5f5ee"/><text x="60" y="324" font-size="26" fill="#20304d">Exif + 两个零字节</text><rect x="360" y="270" width="220" height="90" rx="14" fill="#fce9cf"/><text x="386" y="324" font-size="28" fill="#20304d">TIFF 头</text><rect x="610" y="270" width="350" height="90" rx="14" fill="#d5f5ee"/><text x="637" y="324" font-size="28" fill="#20304d">IFD 与其他数据</text><path d="M470 367L780 367" fill="none" stroke="#536580" stroke-width="3" marker-end="url(#arrow)"/><text x="360" y="410" font-size="25" fill="#20304d">IFD 偏移从 TIFF 头起算</text><text x="40" y="470" font-size="25" fill="#20304d">段长度是大端；TIFF 内部字节序由 II / MM 决定。</text></g></svg>