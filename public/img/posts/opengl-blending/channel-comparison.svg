<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 475" role="img" aria-labelledby="title desc"><title id="title">逐通道比较 vs. 完整像素比较</title><desc id="desc">示意整体比较与通道比较的区别；整体明暗的具体判定取决于实现。</desc><rect width="1000" height="475" rx="20" fill="#f3f6fc"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="36" y="52" font-size="30" fill="#20304d">逐通道比较 vs. 完整像素比较</text><text x="36" y="84" font-size="16" fill="#536580">示意整体比较与通道比较的区别；整体明暗的具体判定取决于实现。</text><rect x="36" y="125" width="214" height="150" rx="10" fill="#e64cb2"/><text x="36" y="311" font-size="20" fill="#20304d">基色 a</text><text x="36" y="344" font-size="16" fill="#20304d">RGB (0.9, 0.3, 0.7)</text><rect x="276" y="125" width="214" height="150" rx="10" fill="#66cc33"/><text x="276" y="311" font-size="20" fill="#20304d">混合色 b</text><text x="276" y="344" font-size="16" fill="#20304d">RGB (0.4, 0.8, 0.2)</text><rect x="516" y="125" width="214" height="150" rx="10" fill="#664c33"/><text x="516" y="311" font-size="20" fill="#20304d">变暗：逐通道 min</text><text x="516" y="344" font-size="16" fill="#20304d">RGB (0.4, 0.3, 0.2)</text><rect x="756" y="125" width="214" height="150" rx="10" fill="#66cc33"/><text x="756" y="311" font-size="20" fill="#20304d">深色：完整像素</text><text x="756" y="344" font-size="16" fill="#20304d">RGB (0.4, 0.8, 0.2)</text><text x="36" y="398" font-size="20" fill="#20304d">逐通道取小值会产生新颜色；整体比较后取用原像素则不会。</text><text x="36" y="436" font-size="18" fill="#20304d">本例以 RGB 总和比较整体明暗：a = 1.9，b = 1.4，深色取 b。</text></g></svg>