<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 475" role="img" aria-labelledby="title desc"><title id="title">混合模式的功能分组</title><desc id="desc">从效果出发理解模式：变暗、变亮、增强对比，以及其他颜色运算。</desc><rect width="1000" height="475" rx="20" fill="#f3f6fc"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="36" y="52" font-size="30" fill="#20304d">混合模式的功能分组</text><text x="36" y="84" font-size="16" fill="#536580">从效果出发理解模式：变暗、变亮、增强对比，以及其他颜色运算。</text><rect x="36" y="116" width="454" height="127" rx="12" fill="#dbe5ff"/><text x="56" y="150" font-size="24" fill="#20304d">变暗系</text><text x="56" y="185" font-size="18" fill="#20304d">变暗 · 正片叠底 · 颜色加深</text><text x="56" y="215" font-size="18" fill="#20304d">线性加深 · 深色</text><rect x="510" y="116" width="454" height="127" rx="12" fill="#d5f5ee"/><text x="530" y="150" font-size="24" fill="#20304d">变亮系</text><text x="530" y="185" font-size="18" fill="#20304d">变亮 · 滤色 · 颜色减淡</text><text x="530" y="215" font-size="18" fill="#20304d">线性减淡 · 浅色</text><rect x="36" y="261" width="454" height="127" rx="12" fill="#fce9cf"/><text x="56" y="295" font-size="24" fill="#20304d">对比系</text><text x="56" y="330" font-size="18" fill="#20304d">叠加 · 柔光 · 强光 · 亮光</text><text x="56" y="360" font-size="18" fill="#20304d">线性光 · 点光 · 实色混合</text><rect x="510" y="261" width="454" height="127" rx="12" fill="#efdefa"/><text x="530" y="295" font-size="24" fill="#20304d">运算与颜色</text><text x="530" y="330" font-size="18" fill="#20304d">差值 · 排除 · 减去 · 划分</text><text x="530" y="360" font-size="18" fill="#20304d">色相 · 饱和度 · 颜色 · 明度</text><text x="36" y="440" font-size="19" fill="#20304d">基础模式：正常、溶解。下文重点解释逐像素颜色运算。</text></g></svg>