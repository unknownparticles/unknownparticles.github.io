<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 535" role="img" aria-labelledby="title desc"><title id="title">正片叠底：相交处更暗</title><desc id="desc">归一化 RGB 逐通道计算。洋红 × 青色 × 黄色，三者交叠为黑色。</desc><rect width="1000" height="535" rx="20" fill="#f3f6fc"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="36" y="52" font-size="30" fill="#20304d">正片叠底：相交处更暗</text><text x="36" y="84" font-size="16" fill="#536580">归一化 RGB 逐通道计算。洋红 × 青色 × 黄色，三者交叠为黑色。</text><defs><clipPath id="c0"><circle cx="420" cy="230" r="112" fill="white"/></clipPath><clipPath id="c1"><circle cx="580" cy="230" r="112" fill="white"/></clipPath><clipPath id="c2"><circle cx="500" cy="340" r="112" fill="white"/></clipPath></defs><circle cx="420" cy="230" r="112" fill="#ff00ff"/><circle cx="580" cy="230" r="112" fill="#00ffff"/><circle cx="500" cy="340" r="112" fill="#ffff00"/><g clip-path="url(#c0)"><circle cx="580" cy="230" r="112" fill="#0000ff"/></g><g clip-path="url(#c0)"><circle cx="500" cy="340" r="112" fill="#ff0000"/></g><g clip-path="url(#c1)"><circle cx="500" cy="340" r="112" fill="#00ff00"/></g><g clip-path="url(#c1)"><g clip-path="url(#c0)"><circle cx="500" cy="340" r="112" fill="#000000"/></g></g><text x="36" y="495" font-size="22" fill="#20304d">c = a × b     黑色参与 → 黑色；白色参与 → 保持原色</text></g></svg>