<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">正常模式与不透明度</title><desc id="desc">同一像素的 RGB 值从基色逐渐过渡到混合色；n = 1 时只保留混合色。</desc><rect width="1000" height="470" rx="20" fill="#f3f6fc"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="36" y="52" font-size="30" fill="#20304d">正常模式与不透明度</text><text x="36" y="84" font-size="16" fill="#536580">同一像素的 RGB 值从基色逐渐过渡到混合色；n = 1 时只保留混合色。</text><rect x="36" y="125" width="168" height="170" rx="10" fill="#1f61cc"/><text x="36" y="331" font-size="24" fill="#20304d">n = 0</text><rect x="226" y="125" width="168" height="170" rx="10" fill="#5763a4"/><text x="226" y="331" font-size="24" fill="#20304d">n = 0.25</text><rect x="416" y="125" width="168" height="170" rx="10" fill="#8f667d"/><text x="416" y="331" font-size="24" fill="#20304d">n = 0.5</text><rect x="606" y="125" width="168" height="170" rx="10" fill="#c76955"/><text x="606" y="331" font-size="24" fill="#20304d">n = 0.75</text><rect x="796" y="125" width="168" height="170" rx="10" fill="#ff6b2e"/><text x="796" y="331" font-size="24" fill="#20304d">n = 1</text><text x="36" y="387" font-size="22" fill="#20304d">蓝色基色 a + 橙色混合色 b → 随不透明度 n 线性插值</text><text x="36" y="429" font-size="26" fill="#20304d">c = (1 − n) × a + n × b</text></g></svg>