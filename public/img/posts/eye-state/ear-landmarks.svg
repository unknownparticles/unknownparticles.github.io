<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc"><title id="title">眼睛纵横比：量眼睑，不量检测框</title><desc id="desc">六点顺序是本例的约定，接入具体模型时需要映射其关键点编号。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#536580"/></marker></defs><rect x="0" y="0" width="1000" height="455" rx="20" fill="#f3f6fc"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="52" font-size="32" fill="#20304d">眼睛纵横比：量眼睑，不量检测框</text><text x="36" y="91" font-size="21" fill="#536580">六点顺序是本例的约定，接入具体模型时需要映射其关键点编号。</text><path d="M110 245Q280 80 450 245Q280 410 110 245Z" fill="#dbe5ff" stroke="#536580" stroke-width="3"/><circle cx="110" cy="245" r="7" fill="#156f78"/><text x="95" y="227" font-size="24" fill="#20304d">p1</text><circle cx="210" cy="176" r="7" fill="#156f78"/><text x="195" y="158" font-size="24" fill="#20304d">p2</text><circle cx="350" cy="176" r="7" fill="#156f78"/><text x="335" y="158" font-size="24" fill="#20304d">p3</text><circle cx="450" cy="245" r="7" fill="#156f78"/><text x="435" y="227" font-size="24" fill="#20304d">p4</text><circle cx="350" cy="314" r="7" fill="#156f78"/><text x="335" y="296" font-size="24" fill="#20304d">p5</text><circle cx="210" cy="314" r="7" fill="#156f78"/><text x="195" y="296" font-size="24" fill="#20304d">p6</text><path d="M210 183L210 307" fill="none" stroke="#536580" stroke-width="3"/><path d="M350 183L350 307" fill="none" stroke="#536580" stroke-width="3"/><path d="M117 245L443 245" fill="none" stroke="#536580" stroke-width="3"/><rect x="515" y="160" width="445" height="180" rx="14" fill="#d5f5ee"/><text x="540" y="209" font-size="25" fill="#20304d">EAR = 两条竖向距离之和</text><text x="540" y="251" font-size="25" fill="#20304d">÷（2 × 两眼角距离）</text><text x="540" y="302" font-size="24" fill="#20304d">闭合 → 竖向距离下降</text><text x="36" y="411" font-size="25" fill="#20304d">关键点缺失 → Unknown；连续低 EAR → 再判定闭眼。</text></g></svg>