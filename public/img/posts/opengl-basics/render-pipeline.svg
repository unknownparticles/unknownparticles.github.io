<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">一次绘制如何到达帧缓冲</title><desc id="desc">此图简化装配、裁剪与可选阶段；片段与最终像素并非一一对应。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#536580"/></marker></defs><rect x="0" y="0" width="1000" height="390" rx="20" fill="#f3f6fc"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="52" font-size="32" fill="#20304d">一次绘制如何到达帧缓冲</text><text x="36" y="91" font-size="21" fill="#536580">此图简化装配、裁剪与可选阶段；片段与最终像素并非一一对应。</text><rect x="32" y="155" width="210" height="120" rx="14" fill="#dbe5ff"/><text x="48" y="201" font-size="26" fill="#20304d">顶点输入</text><text x="48" y="243" font-size="20" fill="#20304d">VBO / 索引</text><path d="M247 215L272 215" fill="none" stroke="#536580" stroke-width="3" marker-end="url(#arrow)"/><rect x="278" y="155" width="210" height="120" rx="14" fill="#d5f5ee"/><text x="294" y="201" font-size="26" fill="#20304d">顶点着色</text><text x="294" y="243" font-size="20" fill="#20304d">裁剪空间位置</text><path d="M493 215L518 215" fill="none" stroke="#536580" stroke-width="3" marker-end="url(#arrow)"/><rect x="524" y="155" width="210" height="120" rx="14" fill="#fce9cf"/><text x="540" y="201" font-size="26" fill="#20304d">光栅化与片段</text><text x="540" y="243" font-size="20" fill="#20304d">插值 / 颜色计算</text><path d="M739 215L764 215" fill="none" stroke="#536580" stroke-width="3" marker-end="url(#arrow)"/><rect x="770" y="155" width="210" height="120" rx="14" fill="#efdefa"/><text x="786" y="201" font-size="26" fill="#20304d">测试与写入</text><text x="786" y="243" font-size="20" fill="#20304d">深度 / 混合 / FBO</text><text x="36" y="340" font-size="23" fill="#20304d">先准备资源与状态，再由绘制命令使用它们。</text></g></svg>