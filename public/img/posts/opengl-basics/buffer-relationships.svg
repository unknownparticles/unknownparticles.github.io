<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">VAO 引用数据，不复制数据</title><desc id="desc">属性格式与缓冲区引用由 VAO 记录，EBO 的绑定也属于 VAO 状态。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#536580"/></marker></defs><rect x="0" y="0" width="1000" height="460" rx="20" fill="#f3f6fc"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="52" font-size="32" fill="#20304d">VAO 引用数据，不复制数据</text><text x="36" y="91" font-size="21" fill="#536580">属性格式与缓冲区引用由 VAO 记录，EBO 的绑定也属于 VAO 状态。</text><rect x="360" y="132" width="280" height="90" rx="14" fill="#dbe5ff"/><text x="400" y="188" font-size="28" fill="#20304d">VAO：属性状态</text><rect x="50" y="290" width="380" height="82" rx="14" fill="#d5f5ee"/><text x="75" y="340" font-size="26" fill="#20304d">VBO：位置、UV 等数据</text><rect x="570" y="290" width="380" height="82" rx="14" fill="#fce9cf"/><text x="593" y="340" font-size="26" fill="#20304d">EBO：0, 1, 2, 0, 2, 3</text><path d="M410 222L240 287" fill="none" stroke="#536580" stroke-width="3" marker-end="url(#arrow)"/><path d="M590 222L760 287" fill="none" stroke="#536580" stroke-width="3" marker-end="url(#arrow)"/><text x="36" y="420" font-size="25" fill="#20304d">四个完整顶点 + 六个索引 → 两个共享边的三角形</text></g></svg>