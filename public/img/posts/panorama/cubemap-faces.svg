<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">Cubemap 的六个方向</title><desc id="desc">相机默认朝 −Z，Y 向上；front / back 等文件名不能代替轴向定义。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#536580"/></marker></defs><rect x="0" y="0" width="1000" height="550" rx="20" fill="#f3f6fc"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="52" font-size="32" fill="#20304d">Cubemap 的六个方向</text><text x="36" y="91" font-size="21" fill="#536580">相机默认朝 −Z，Y 向上；front / back 等文件名不能代替轴向定义。</text><rect x="390" y="125" width="130" height="86" rx="6" fill="#dbe5ff"/><text x="429" y="179" font-size="32" fill="#20304d">+Y</text><rect x="245" y="225" width="130" height="86" rx="6" fill="#dbe5ff"/><text x="284" y="279" font-size="32" fill="#20304d">−X</text><rect x="390" y="225" width="130" height="86" rx="6" fill="#d5f5ee"/><text x="429" y="279" font-size="32" fill="#20304d">−Z</text><rect x="535" y="225" width="130" height="86" rx="6" fill="#dbe5ff"/><text x="574" y="279" font-size="32" fill="#20304d">+X</text><rect x="680" y="225" width="130" height="86" rx="6" fill="#dbe5ff"/><text x="719" y="279" font-size="32" fill="#20304d">+Z</text><rect x="390" y="325" width="130" height="86" rx="6" fill="#dbe5ff"/><text x="429" y="379" font-size="32" fill="#20304d">−Y</text><text x="40" y="465" font-size="25" fill="#20304d">API 上传顺序：+X、−X、+Y、−Y、+Z、−Z</text><text x="40" y="505" font-size="22" fill="#20304d">展开图仅标识邻接；每面的旋转与 UV 方向还需按纹理约定校验。</text></g></svg>