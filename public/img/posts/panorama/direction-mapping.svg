<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 475" role="img" aria-labelledby="title desc"><title id="title">全景采样：屏幕方向到环境纹理</title><desc id="desc">显示全景背景无需先构建球体网格；关键是方向与纹理表示保持一致。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#536580"/></marker></defs><rect x="0" y="0" width="1000" height="475" rx="20" fill="#f3f6fc"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="52" font-size="32" fill="#20304d">全景采样：屏幕方向到环境纹理</text><text x="36" y="91" font-size="21" fill="#536580">显示全景背景无需先构建球体网格；关键是方向与纹理表示保持一致。</text><rect x="40" y="150" width="250" height="135" rx="14" fill="#dbe5ff"/><text x="68" y="195" font-size="28" fill="#20304d">屏幕片段</text><text x="68" y="240" font-size="25" fill="#20304d">生成方向 d</text><path d="M300 200L430 165" fill="none" stroke="#536580" stroke-width="3" marker-end="url(#arrow)"/><path d="M300 245L430 315" fill="none" stroke="#536580" stroke-width="3" marker-end="url(#arrow)"/><rect x="445" y="125" width="510" height="110" rx="14" fill="#d5f5ee"/><text x="468" y="168" font-size="28" fill="#20304d">经纬方向 → (u,v)</text><text x="468" y="207" font-size="23" fill="#20304d">sampler2D：二维等距柱状图</text><rect x="445" y="275" width="510" height="110" rx="14" fill="#fce9cf"/><text x="468" y="318" font-size="28" fill="#20304d">方向 d → 面与面内坐标</text><text x="468" y="357" font-size="23" fill="#20304d">samplerCube：六面立方体纹理</text><text x="40" y="435" font-size="25" fill="#20304d">同一条观察射线，两种环境数据表示。</text></g></svg>