<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 465" role="img" aria-labelledby="title desc"><title id="title">Android：消费与拦截分开理解</title><desc id="desc">一般序列以 UP 或 CANCEL 之一结束；父级可观察事件而不消费。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#536580"/></marker></defs><rect x="0" y="0" width="1000" height="465" rx="20" fill="#f3f6fc"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="52" font-size="32" fill="#20304d">Android：消费与拦截分开理解</text><text x="36" y="91" font-size="21" fill="#536580">一般序列以 UP 或 CANCEL 之一结束；父级可观察事件而不消费。</text><rect x="40" y="140" width="920" height="90" rx="14" fill="#dbe5ff"/><text x="64" y="194" font-size="26" fill="#20304d">DOWN：Activity → ViewGroup → 子 View（接受手势）</text><rect x="40" y="265" width="920" height="100" rx="14" fill="#fce9cf"/><text x="64" y="307" font-size="26" fill="#20304d">MOVE：父级决定拦截 → 子 View 收到 CANCEL</text><text x="64" y="343" font-size="23" fill="#20304d">后续事件交给父级；子 View 清理本次手势</text><text x="40" y="422" font-size="25" fill="#20304d">消费：处理结果返回调用者；拦截：父级改变分发目标。</text></g></svg>