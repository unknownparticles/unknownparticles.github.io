<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">用反馈推动下一轮学习</title><desc id="desc">每轮围绕一个可验证的小目标，避免只收集工具名称。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#536580"/></marker></defs><rect x="0" y="0" width="1000" height="390" rx="20" fill="#f3f6fc"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="52" font-size="32" fill="#20304d">用反馈推动下一轮学习</text><text x="36" y="91" font-size="21" fill="#536580">每轮围绕一个可验证的小目标，避免只收集工具名称。</text><rect x="32" y="155" width="210" height="120" rx="14" fill="#dbe5ff"/><text x="48" y="201" font-size="26" fill="#20304d">明确问题</text><text x="48" y="243" font-size="20" fill="#20304d">设定小目标</text><path d="M247 215L272 215" fill="none" stroke="#536580" stroke-width="3" marker-end="url(#arrow)"/><rect x="278" y="155" width="210" height="120" rx="14" fill="#d5f5ee"/><text x="294" y="201" font-size="26" fill="#20304d">动手实现</text><text x="294" y="243" font-size="20" fill="#20304d">完成最小项目</text><path d="M493 215L518 215" fill="none" stroke="#536580" stroke-width="3" marker-end="url(#arrow)"/><rect x="524" y="155" width="210" height="120" rx="14" fill="#fce9cf"/><text x="540" y="201" font-size="26" fill="#20304d">验证结果</text><text x="540" y="243" font-size="20" fill="#20304d">测试与调试</text><path d="M739 215L764 215" fill="none" stroke="#536580" stroke-width="3" marker-end="url(#arrow)"/><rect x="770" y="155" width="210" height="120" rx="14" fill="#efdefa"/><text x="786" y="201" font-size="26" fill="#20304d">复盘分享</text><text x="786" y="243" font-size="20" fill="#20304d">解释并找出缺口</text><text x="36" y="340" font-size="23" fill="#20304d">把下一轮的问题写下来，再选择需要学习的知识。</text></g></svg>