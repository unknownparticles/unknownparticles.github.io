<svg xmlns="http://www.w3.org/2000/svg" width="720" height="655" viewBox="0 0 720 655" role="img" aria-labelledby="title desc"><title id="title">事件入口、协调层、执行器与状态存储</title><desc id="desc">原创概念图：后续事件可以直通执行器；图中不是原型完整部署拓扑。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#514c79"/></marker></defs><rect width="100%" height="100%" fill="#f7f6f2"/><g font-family="system-ui, sans-serif" fill="#2d2a5e"><text x="28" y="42" font-size="28">职责拆分：入口连续，执行隔离</text><rect x="30" y="75" width="300" height="82" rx="12" fill="#fff" stroke="#514c79" stroke-width="2"/><text x="48" y="108" font-size="22">用户的工作入口</text><text x="48" y="137" font-size="16">IM / GitHub / 邮件：这里只画概念</text><rect x="390" y="75" width="300" height="82" rx="12" fill="#fff2be" stroke="#514c79" stroke-width="2"/><text x="408" y="108" font-size="22">确定性准入</text><text x="408" y="137" font-size="16">来源、身份、规则、事件去重</text><path d="M330 116 L390 116" fill="none" stroke="#514c79" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="220" width="300" height="82" rx="12" fill="#d6f1f6" stroke="#514c79" stroke-width="2"/><text x="408" y="253" font-size="22">全局协调层</text><text x="408" y="282" font-size="16">处理新工作与跨任务决策</text><path d="M540 157 L540 220" fill="none" stroke="#514c79" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="220" width="300" height="82" rx="12" fill="#fff" stroke="#514c79" stroke-width="2"/><text x="48" y="253" font-size="22">已知任务的后续事件</text><text x="48" y="282" font-size="16">订阅直通，只提供相关上下文</text><path d="M180 157 L180 220" fill="none" stroke="#514c79" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="385" width="300" height="82" rx="12" fill="#dff1d0" stroke="#514c79" stroke-width="2"/><text x="48" y="418" font-size="22">执行器 A：任务上下文</text><text x="48" y="447" font-size="16">复现输入 → 修改 → 校验</text><rect x="390" y="385" width="300" height="82" rx="12" fill="#dff1d0" stroke="#514c79" stroke-width="2"/><text x="408" y="418" font-size="22">执行器 B：另一任务</text><text x="408" y="447" font-size="16">自己的输入、工作目录与状态</text><path d="M180 302 L180 385" fill="none" stroke="#514c79" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 302 L245 385" fill="none" stroke="#514c79" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 302 L540 385" fill="none" stroke="#514c79" stroke-width="2" marker-end="url(#arrow)"/><rect x="110" y="535" width="500" height="82" rx="12" fill="#fff" stroke="#514c79" stroke-width="2"/><text x="128" y="568" font-size="22">任务状态与结果登记</text><text x="128" y="597" font-size="16">可追溯记录 → 汇总可审阅结果，按需通知</text><path d="M180 467 L250 535" fill="none" stroke="#514c79" stroke-width="2" marker-end="url(#arrow)"/><path d="M540 467 L470 535" fill="none" stroke="#514c79" stroke-width="2" marker-end="url(#arrow)"/></g></svg>