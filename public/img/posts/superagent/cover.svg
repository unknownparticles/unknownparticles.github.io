<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Super-agent 工程拆解</title><desc id="desc">文章原创封面：事件、执行与交付。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#514c79"/></marker></defs><rect width="100%" height="100%" fill="#f7f6f2"/><g font-family="system-ui, sans-serif" fill="#2d2a5e"><text x="72" y="100" font-size="22">ENGINEERING NOTES</text><text x="72" y="205" font-size="70">Super-agent</text><text x="72" y="265" font-size="40">把任务连续性做进系统</text><rect x="72" y="365" width="310" height="100" rx="12" fill="#fff2be" stroke="#514c79" stroke-width="2"/><text x="90" y="398" font-size="22">事件入口</text><text x="90" y="427" font-size="16">先过滤，再决定是否行动</text><path d="M382 415 L440 415" fill="none" stroke="#514c79" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="365" width="310" height="100" rx="12" fill="#d6f1f6" stroke="#514c79" stroke-width="2"/><text x="458" y="398" font-size="22">独立执行</text><text x="458" y="427" font-size="16">每个任务自己的上下文</text><path d="M750 415 L808 415" fill="none" stroke="#514c79" stroke-width="2" marker-end="url(#arrow)"/><rect x="808" y="365" width="310" height="100" rx="12" fill="#dff1d0" stroke="#514c79" stroke-width="2"/><text x="826" y="398" font-size="22">可靠交付</text><text x="826" y="427" font-size="16">状态、恢复与结果核对</text><text x="72" y="560" font-size="23">原创图解 · 可运行演示 · 公开源码对照</text></g></svg>