<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500" role="img" aria-labelledby="title desc"><title id="title">事件到讨论、任务和产物的引用链</title><desc id="desc">原创示意：短摘要和稳定 ID 留在窗口，完整资料按需读取。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#514c79"/></marker></defs><rect width="100%" height="100%" fill="#f7f6f2"/><g font-family="system-ui, sans-serif" fill="#2d2a5e"><text x="28" y="42" font-size="27">上下文：保留入口，按引用展开</text><rect x="30" y="78" width="640" height="85" rx="12" fill="#fff2be" stroke="#514c79" stroke-width="2"/><text x="48" y="111" font-size="22">当前事件 event:review</text><text x="48" y="140" font-size="16">正文片段 + thread:42，不必塞入全部历史</text><path d="M350 163 L350 205" fill="none" stroke="#514c79" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="205" width="640" height="85" rx="12" fill="#d6f1f6" stroke="#514c79" stroke-width="2"/><text x="48" y="238" font-size="22">相关讨论 thread:42</text><text x="48" y="267" font-size="16">摘要 + task:fix-42，继续查找负责的任务</text><path d="M350 290 L350 330" fill="none" stroke="#514c79" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="330" width="640" height="85" rx="12" fill="#dff1d0" stroke="#514c79" stroke-width="2"/><text x="48" y="363" font-size="22">任务与产物</text><text x="48" y="392" font-size="16">task:fix-42 → artifact:patch，原始内容留在外部</text><text x="30" y="466" font-size="18">打包限制的是字符预算；真实系统还需要 token 估算。</text></g></svg>