<svg xmlns="http://www.w3.org/2000/svg" width="720" height="515" viewBox="0 0 720 515" role="img" aria-labelledby="title desc"><title id="title">快照恢复、执行代次与迟到结果</title><desc id="desc">原创教学示意：代次检查只保护模型内的状态更新，不撤销外部副作用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#514c79"/></marker></defs><rect width="100%" height="100%" fill="#f7f6f2"/><g font-family="system-ui, sans-serif" fill="#2d2a5e"><text x="28" y="42" font-size="27">恢复时，旧执行结果也可能回来</text><rect x="30" y="85" width="300" height="85" rx="12" fill="#fff" stroke="#514c79" stroke-width="2"/><text x="48" y="118" font-size="22">第一次执行：代次 1</text><text x="48" y="147" font-size="16">收到任务，尚未交付</text><rect x="390" y="85" width="300" height="85" rx="12" fill="#fff2be" stroke="#514c79" stroke-width="2"/><text x="408" y="118" font-size="22">状态快照</text><text x="408" y="147" font-size="16">任务、订阅、已见事件 ID</text><path d="M330 127 L390 127" fill="none" stroke="#514c79" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="230" width="300" height="85" rx="12" fill="#d6f1f6" stroke="#514c79" stroke-width="2"/><text x="48" y="263" font-size="22">恢复执行：代次 2</text><text x="48" y="292" font-size="16">教学模型注入“无进展”信号</text><path d="M470 170 L230 230" fill="none" stroke="#514c79" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="230" width="300" height="85" rx="12" fill="#ffe3e3" stroke="#514c79" stroke-width="2"/><text x="408" y="263" font-size="22">代次 1 的迟到结果</text><text x="408" y="292" font-size="16">拒绝更新当前任务状态</text><path d="M180 170 L480 230" fill="none" stroke="#514c79" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="390" width="660" height="85" rx="12" fill="#dff1d0" stroke="#514c79" stroke-width="2"/><text x="48" y="423" font-size="22">只登记当前代次的结果</text><text x="48" y="452" font-size="16">代次 2 → 一条可审阅结果；重复回调不会再登记</text><path d="M180 315 L180 390" fill="none" stroke="#514c79" stroke-width="2" marker-end="url(#arrow)"/></g></svg>