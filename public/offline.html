  <style>
/* Hallmark · checked: 2026-10-27 · genre: modern-minimal (inferred)
 * hero: custom status page · nav: none · footer: none · posture: restrained
 * built: the project · redesign: polish · v2.0.0 */
:root {
  --color-paper: oklch(12.5% 0.012 125);
  --color-ink: oklch(94% 0.014 120);
  --color-muted: oklch(69% 0.02 120);
  --color-accent: oklch(87% 0.18 122);
  --color-accent-strong: oklch(91% 0.16 122);
  --color-accent-ink: oklch(14% 0.018 125);
  --color-focus: oklch(88% 0.19 122);
  --font-body: "Manrope", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mark: monospace;
  scrollbar-color: var(--color-muted) var(--color-paper);
}
* { box-sizing: border-box; }
::selection { background: var(--color-accent); color: var(--color-accent-ink); }
html, body { overflow-x: clip; }
body {
  display: grid;
  min-height: 100svh;
  margin: 0;
  place-items: center;
  background: var(--color-paper);
  caret-color: var(--color-accent);
  color: var(--color-ink);
  font-family: var(--font-body);
  text-align: center;
}
.wrap { width: min(100% - 32px, 620px); }
.mark {
  display: grid;
  width: 56px;
  height: 56px;
  margin: 0 auto 32px;
  place-items: center;
  border-radius: 8px;
  background: var(--color-accent);
  color: var(--color-accent-ink);
  font-family: var(--font-mark);
  font-weight: 700;
}
h1 {
  min-width: 0;
  margin: 0;
  overflow-wrap: break-word;
  color: var(--color-ink);
  font-size: 48px;
  font-weight: 600;
  line-height: 1;
  text-wrap: balance;
}
p {
  max-width: 520px;
  margin: 24px auto 32px;
  color: var(--color-muted);
  font-size: 16px;
  line-height: 1.5;
  text-wrap: pretty;
}
button {
  min-height: 48px;
  padding: 8px 12px;
  border: 1px solid var(--color-accent);
  border-radius: 8px;
  background: var(--color-accent);
  color: var(--color-accent-ink);
  font: 600 16px var(--font-body);
  cursor: pointer;
  transition: background-color 220ms cubic-bezier(0.22, 1, 0.36, 1);
}
button:hover { background: var(--color-accent-strong); }
button:active { transform: scale(0.98); }
button:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 4px; }
@media (max-width: 480px) { h1 { font-size: 36px; line-height: 1.11; } }
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>

  </main>
</body>
