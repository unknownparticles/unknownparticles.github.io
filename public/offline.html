<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13241e">
  <title>暂时无法连接网络 · Alun / 开发笔记</title>
  <style>
    *{box-sizing:border-box}body{display:grid;min-height:100vh;margin:0;place-items:center;background:#e5eee9;color:#13241e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;text-align:center}.wrap{width:min(100% - 32px,620px)}.mark{display:grid;width:52px;height:52px;margin:0 auto 28px;place-items:center;background:#13241e;color:#fff;font-family:monospace;font-weight:700}.code{margin:0 0 10px;color:#c94e31;font-family:monospace;font-size:13px}h1{margin:0;font-size:clamp(34px,8vw,52px);line-height:1.12}p{max-width:520px;margin:20px auto 30px;color:#5c6b65;line-height:1.75}button{min-height:46px;padding:9px 16px;border:1px solid #08766a;border-radius:6px;background:#08766a;color:#fff;font:700 14px inherit;cursor:pointer}button:focus-visible{outline:3px solid #f0a51a;outline-offset:3px}
  </style>
</head>
<body>
  <main class="wrap" id="main-content">
    <span class="mark" aria-hidden="true">A/</span>
    <p class="code">STATUS / OFFLINE</p>
    <h1>暂时无法连接网络</h1>
    <p>当前网络不可用。恢复连接后重新加载，即可获取最新内容。</p>
    <button type="button" onclick="window.location.reload()">重新加载</button>
  </main>
</body>
</html>
